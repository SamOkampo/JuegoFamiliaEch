name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Worker security unit tests
        run: npm run test:worker-security

      - name: Cloudflare multiplayer smoke
        run: npm run test:smoke:cloudflare

      - name: Security integration smoke
        run: npm run test:integration:security

      - name: Validate Worker syntax
        run: node --check worker/src/index.js

      - name: Validate service worker syntax
        run: node --check public/sw.js

      - name: Production build
        run: npm run build

      - name: Cloudflare frontend build
        run: npm run build:cloudflare

      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: PWA + mobile E2E — iPhone WebKit + Android Chromium
        run: npm run test:e2e:mobile
