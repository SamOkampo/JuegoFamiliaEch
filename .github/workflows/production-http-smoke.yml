name: Production HTTP Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: prod-http-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public routes, headers and PWA assets
        run: node scripts/production-http-smoke.mjs
